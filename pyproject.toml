[project]
name = "fedipol"
version = "1.0.0"
description = "Fediverse Activity Tracker - automatisierte ETL-Pipeline und Dashboard-Betrieb"
requires-python = ">=3.12"
dependencies = [
    "django>=5.1",
    "duckdb>=1.1",
    "pyyaml>=6.0",
    "requests>=2.32",
    "gunicorn>=23.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-django>=4.9",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fedipol"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "fedipol.settings"
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    "playwright: Browser-Smoke-Tests (erfordert installierten Playwright-Browser)",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
